<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 270" width="220" height="270" role="img">
  <title>Phaworma shawarma mascot — happy</title>
  <!-- Legs (behind the body) -->
  <path d="M96 204 L93 240" stroke="#50251c" stroke-width="9" stroke-linecap="round" fill="none"/>
  <path d="M124 204 L127 240" stroke="#50251c" stroke-width="9" stroke-linecap="round" fill="none"/>
  <ellipse cx="86" cy="246" rx="11" ry="6.5" fill="#50251c" transform="rotate(-12 86 246)"/>
  <ellipse cx="134" cy="246" rx="11" ry="6.5" fill="#50251c" transform="rotate(12 134 246)"/>
  <!-- Arms: both up in a V -->
  <path d="M74 140 Q42 124 36 92" stroke="#50251c" stroke-width="9" stroke-linecap="round" fill="none"/>
  <circle cx="35" cy="86" r="8" fill="#50251c"/>
  <path d="M146 140 Q178 124 184 92" stroke="#50251c" stroke-width="9" stroke-linecap="round" fill="none"/>
  <circle cx="185" cy="86" r="8" fill="#50251c"/>
  <!-- Filling (behind the top of the wrap): lettuce, cheese, tomato -->
  <path d="M68 125 Q62 30 90 34 Q96 12 112 24 Q126 8 140 28 Q158 24 152 125 Q110 138 68 125 Z" fill="#3a6e4c" stroke="#50251c" stroke-width="7" stroke-linejoin="round"/>
  <path d="M66 110 L84 22 L104 108 Q85 118 66 110 Z" fill="#f6e7c8" stroke="#50251c" stroke-width="7" stroke-linejoin="round"/>
  <circle cx="140" cy="48" r="16" fill="#d14641" stroke="#50251c" stroke-width="7"/>
  <!-- Wrap -->
  <rect x="63" y="62" width="94" height="152" rx="42" fill="#f1e3d6" stroke="#50251c" stroke-width="8"/>
  <!-- Diagonal roll marks (the burnt-orange accent) -->
  <path d="M80 96 L140 84" stroke="#ce6509" stroke-width="7" stroke-linecap="round"/>
  <path d="M80 158 L140 146" stroke="#ce6509" stroke-width="7" stroke-linecap="round"/>
  <path d="M84 188 L136 178" stroke="#ce6509" stroke-width="7" stroke-linecap="round"/>
  <!-- Face: closed happy eyes, big laughing mouth -->
  <path d="M85 117 Q93 108 101 117" stroke="#50251c" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M119 117 Q127 108 135 117" stroke="#50251c" stroke-width="6" stroke-linecap="round" fill="none"/>
  <ellipse cx="79" cy="127" rx="6" ry="3.5" fill="#ff8884" opacity="0.6"/>
  <ellipse cx="141" cy="127" rx="6" ry="3.5" fill="#ff8884" opacity="0.6"/>
  <path d="M92 131 Q110 139 128 131 Q110 163 92 131 Z" fill="#d14641" stroke="#50251c" stroke-width="5" stroke-linejoin="round"/>
  <ellipse cx="110" cy="148" rx="8" ry="4.5" fill="#ff8884"/>
</svg>
